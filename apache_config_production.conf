# Configuración Apache para Facturación IA
# Frontend y Backend a través del mismo dominio

<VirtualHost *:443>
    ServerName saman.lafortuna.com.co
    
    # SSL Configuration (asumiendo que ya tienes SSL configurado)
    SSLEngine on
    SSLCertificateFile /path/to/your/certificate.crt
    SSLCertificateKeyFile /path/to/your/private.key
    SSLCertificateChainFile /path/to/your/chain.crt
    
    # Frontend - Vite Dev Server
    # WebSocket support for HMR
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/facturacion_ia/(.*)$ ws://192.168.2.91:5173/$1 [P,L]
    
    # Frontend HTTP
    ProxyPass /facturacion_ia/ http://192.168.2.91:5173/
    ProxyPassReverse /facturacion_ia/ http://192.168.2.91:5173/
    
    # Backend API
    ProxyPass /api/ http://192.168.2.91:8000/api/
    ProxyPassReverse /api/ http://192.168.2.91:8000/api/
    
    # Headers para CORS y seguridad
    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization"
    
    # Logs
    ErrorLog ${APACHE_LOG_DIR}/facturacion_ia_error.log
    CustomLog ${APACHE_LOG_DIR}/facturacion_ia_access.log combined
</VirtualHost>

# Redirect HTTP to HTTPS
<VirtualHost *:80>
    ServerName saman.lafortuna.com.co
    Redirect permanent / https://saman.lafortuna.com.co/
</VirtualHost>
