# nginx config para servir el build de Vite como SPA en Railway.
#
# Puntos clave:
#   - `try_files ... /index.html` → React Router maneja rutas cliente-side
#     (sin esto, /app/facturas devuelve 404 en refresh).
#   - Gzip para reducir el bundle en la primera carga.
#   - Cache agresivo (1 año) para assets con hash de Vite; sin cache para
#     index.html (para tomar la última versión al deploy).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- gzip ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # --- assets con hash: cache eterno ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Security headers (defensa en profundidad; backend ya los pone también) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- SPA fallback: cualquier ruta desconocida → index.html ---
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # --- healthcheck para Railway ---
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
